name: Market Open Alert

on:
  schedule:
    # 台股 09:00 開盤 + 30 分 = 09:30 台北時間 = 01:30 UTC, 週一~週五
    - cron: '30 1 * * 1-5'
    # 美股 09:30 EDT 開盤 + 30 分 = 10:00 EDT = 14:00 UTC, 週一~週五
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: '市場 (tw / us)'
        required: true
        default: 'tw'
        type: choice
        options:
          - tw
          - us

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine market
        id: market
        run: |
          if [ -n "${{ github.event.inputs.market }}" ]; then
            echo "market=${{ github.event.inputs.market }}" >> $GITHUB_OUTPUT
            echo "Manual trigger: ${{ github.event.inputs.market }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "01" ]; then
              echo "market=tw" >> $GITHUB_OUTPUT
              echo "Cron trigger: TW (UTC hour=$HOUR)"
            else
              echo "market=us" >> $GITHUB_OUTPUT
              echo "Cron trigger: US (UTC hour=$HOUR)"
            fi
          fi

      - name: Run market open analysis
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/market_open_alert.py ${{ steps.market.outputs.market }}
