name: Pre-Market Alert (TPE 08:15 / 08:30)

# 為什麼獨立成一個 workflow:
#   原本 08:15/08:30 的盤前推播 (含日股韓股) 走 market_open_alert.yml 的「分鐘分桶」dispatch,
#   GitHub Actions 在 00:15/00:30 UTC 這種熱門時段常延遲, drift 一旦超過邊界就被誤判成
#   pre_market_830 或 monitor → 盤前根本沒推 ("都沒跳")。
#   這裡拆成專屬 workflow, 且用 github.event.schedule (觸發它的 cron 表達式本身) 判 815/830,
#   那是「排程身分」不是「實際時間」, 不受延遲影響 → drift-proof, 怎麼延遲都不會被改路由。

concurrency:
  # 用「專屬」群組 (不跟 market_open_alert 共用) — 盤前是時效性推播, 不該被忙碌的主 workflow
  # 排隊或取消。它只有兩條 cron (00:15/00:30) 互不重疊, 自我序列化即可; 與別人的 state 併發
  # 寫入由 watchlist_store 的 merge-on-save 緩解 (盤前一天一次, 撞點機率極低)。
  # 815 / 830 各一組: 同一組 GitHub 只留 1 個 pending, 合併成一組時晚到的 815 cron 會擠掉 830 的準時觸發
  group: ${{ format('pre-market-{0}', github.event.inputs.slot || ((github.event.schedule == '33 0 * * 1-5' || github.event.schedule == '41 0 * * 1-5') && 'pre_market_830' || 'pre_market_815')) }}
  cancel-in-progress: false

on:
  schedule:
    # 重要: 避開 :00/:15/:30/:45 這些全球最壅塞的 cron 分鐘點。
    # GitHub 官方明示排程 workflow 在高負載時「可能延遲、甚至不執行」, 而 00:15/00:30 UTC
    # 正是最糟的時段 → 盤前推播長期「完全沒收到」的主因。改到冷門分鐘大幅提高執行率。
    - cron: '17 0 * * 1-5'   # 08:17 TPE = 00:17 UTC (日韓開盤 +17min)
    - cron: '33 0 * * 1-5'   # 08:33 TPE = 00:33 UTC (日韓 +33min, 含 TL;DR + 外資籌碼)
    # 備援 cron (2026-08 新增): 排程延遲不可控, 多排一條錯開的 → 只要有一條準時跑到就準時推。
    # 重複由 market_open_alert.py 的 push_dedup 守衛擋掉 (300 分鐘窗), 不會推兩封。
    - cron: '24 0 * * 1-5'   # 08:24 TPE 備援 → pre_market_815
    - cron: '41 0 * * 1-5'   # 08:41 TPE 備援 → pre_market_830
  workflow_dispatch:
    inputs:
      slot:
        description: '手動觸發要推哪個 slot'
        type: choice
        default: pre_market_815
        options: [pre_market_815, pre_market_830]
      source:
        description: '觸發來源 (punctual = cron-job.org / 工作排程器準時觸發, 仍會檢查是否已推過; manual = 手動強制補推)'
        required: false
        default: 'manual'
        type: choice
        options: [manual, punctual]

jobs:
  pre_market:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 整個 Python 環境 (含已安裝套件) 一起快取: 命中時直接跳過 pip install,
      # 每次 run 省 40~90 秒 → 推播更快送出。requirements.txt 一改 key 就變, 自動重裝。
      - name: Cache Python environment
        id: pyenv-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: pyenv-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        if: steps.pyenv-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine slot (drift-proof — 用 cron 身分而非實際時間)
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "market=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "manual: ${{ github.event.inputs.slot }}"
          elif [ "${{ github.event.schedule }}" = "33 0 * * 1-5" ] \
            || [ "${{ github.event.schedule }}" = "41 0 * * 1-5" ]; then
            echo "market=pre_market_830" >> $GITHUB_OUTPUT
            echo "cron ${{ github.event.schedule }} → pre_market_830"
          else
            echo "market=pre_market_815" >> $GITHUB_OUTPUT
            echo "cron 17 0 (或其他) → pre_market_815"
          fi

      - name: Run pre-market alert
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 觸發本次 run 的 cron 字串 → radar/core/schedule_guard 判斷是否遲到太久 (手動觸發時為空)
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_SOURCE: ${{ github.event.inputs.source }}
          STALE_GUARD: ${{ vars.STALE_GUARD || '1' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          # monitor_state 跨 run 保存 (去重/冷卻/上限) — 缺這兩個所有去重都會失效
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python scripts/market_open_alert.py "${{ steps.slot.outputs.market }}"
